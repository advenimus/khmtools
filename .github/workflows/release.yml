name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'        # stable, e.g. v2.0.0
      - 'v[0-9]+.[0-9]+.[0-9]+-beta.*' # beta,   e.g. v2.0.0-beta.1

permissions:
  contents: read

jobs:
  verify:
    name: Verify tag
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.detect.outputs.tag }}
      channel: ${{ steps.detect.outputs.channel }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect channel and check versions match the tag
        id: detect
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          if [[ "$TAG" == *"-beta"* ]]; then CHANNEL=beta; else CHANNEL=stable; fi

          CONF=$(node -p "require('./src-tauri/tauri.conf.json').version")
          PKG=$(node -p "require('./package.json').version")
          CARGO=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)
          for pair in "tauri.conf.json:$CONF" "package.json:$PKG" "Cargo.toml:$CARGO"; do
            if [ "${pair#*:}" != "$VERSION" ]; then
              echo "::error::${pair%%:*} says ${pair#*:} but the tag is $TAG. Bump the version before tagging."
              exit 1
            fi
          done

          git fetch --no-tags origin main dev 2>/dev/null || git fetch --no-tags origin main
          ALLOWED="origin/main"
          if [ "$CHANNEL" = beta ] && git rev-parse --verify -q origin/dev >/dev/null; then
            ALLOWED="origin/main origin/dev"
          fi
          ok=false
          for b in $ALLOWED; do
            if git merge-base --is-ancestor "$GITHUB_SHA" "$b"; then ok=true; fi
          done
          if [ "$ok" != true ]; then
            echo "::error::$TAG points at a commit that isn't on $ALLOWED."
            exit 1
          fi

          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.os }})
    needs: verify
    # Requires approval in the "release" environment before any signing
    # secrets are handed to the build.
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            args: '--target aarch64-apple-darwin --bundles app,dmg,updater'
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            args: '--bundles nsis,updater'
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: '--bundles deb,appimage,updater'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Import Apple Developer ID certificate
        if: matrix.os == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security find-identity -v -p codesigning build.keychain
          rm certificate.p12

      - name: Write App Store Connect API key
        if: matrix.os == 'macos-latest'
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$APPLE_API_KEY_BASE64" | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey.p8"
          echo "APPLE_API_KEY_PATH=$HOME/.appstoreconnect/private_keys/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Build & sign
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm tauri build ${{ matrix.args }}

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*
            src-tauri/target/release/bundle/**/*

  publish:
    name: Publish release
    needs: [verify, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true

      - name: Stage release files
        shell: bash
        run: |
          mkdir -p release
          # Installers plus the .sig files the updater needs. Tauri 2 signs the
          # Windows .exe and Linux .AppImage directly.
          find dist -type f \( \
            -name '*.dmg' -o \
            -name '*.app.tar.gz' -o -name '*.app.tar.gz.sig' -o \
            -name '*-setup.exe' -o -name '*-setup.exe.sig' -o \
            -name '*.AppImage' -o -name '*.AppImage.sig' -o \
            -name '*.deb' \) -print -exec cp {} release/ \;
          # GitHub renames release assets by replacing spaces with dots; do the same
          # locally so the manifest URLs match the actual download paths.
          for f in release/*; do
            base=$(basename "$f")
            renamed=$(printf '%s' "$base" | tr ' ' '.')
            if [ "$base" != "$renamed" ]; then
              mv -- "$f" "release/$renamed"
            fi
          done
          ls -la release/

      - name: Build latest.json
        env:
          TAG: ${{ needs.verify.outputs.tag }}
          CHANNEL: ${{ needs.verify.outputs.channel }}
        run: |
          node .github/workflows/make-manifest.mjs \
            --version "${TAG#v}" \
            --tag "$TAG" \
            --channel "$CHANNEL" \
            --release-dir release \
            --out release

      - name: Create / update release (stable)
        if: needs.verify.outputs.channel == 'stable'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" release/* \
              --title "$TAG" \
              --generate-notes \
              --latest
          fi

      - name: Create / update release (beta) and move beta tag
        if: needs.verify.outputs.channel == 'beta'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          # 1. Specific versioned beta release
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" release/* \
              --title "$TAG" \
              --generate-notes \
              --prerelease
          fi

          # 2. Standing "beta" release the updater reads. Updated in place so
          #    the endpoint never 404s, and the manifest goes up last so it
          #    never points at files that aren't uploaded yet.
          NOTES="Floating release pointing to the latest beta build. Source: $TAG"
          if gh release view beta >/dev/null 2>&1; then
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/beta" -f sha="$GITHUB_SHA" -F force=true
          else
            gh release create beta --title "Latest beta ($TAG)" --notes "$NOTES" --prerelease --target "$GITHUB_SHA"
          fi
          find release -type f ! -name 'latest-beta.json' -print0 | xargs -0 gh release upload beta --clobber
          gh release upload beta release/latest-beta.json --clobber
          gh release view beta --json assets -q '.assets[].name' | while read -r asset; do
            if [ ! -f "release/$asset" ]; then
              gh release delete-asset beta "$asset" --yes
            fi
          done
          gh release edit beta --title "Latest beta ($TAG)" --notes "$NOTES"
